name: S0 checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.2
          cache: true
      - run: go mod download
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: go test -mod=readonly -race ./...
        if: runner.os == 'Linux'
      - run: pnpm build
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-${{ matrix.os }}
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
