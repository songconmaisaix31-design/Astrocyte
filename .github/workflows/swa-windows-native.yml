name: SWA Windows native candidate
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/swa-windows-native.yml'
      - 'package.json'
      - 'pnpm-*.yaml'
      - 'go.mod'
      - 'go.sum'
      - 'dependencies.lock.json'
      - 'third_party/orca-v1.4.230/package.json'
      - 'cmd/**'
      - 'internal/**'
      - 'contracts/**'
      - 'runtime/**'
      - 'scripts/**'
      - 'tests/swa-cli-headless/**'
      - 'third_party/orca-v1.4.230/src/**'
      - 'third_party/orca-v1.4.230/native/**'
      - 'third_party/orca-v1.4.230/config/**'
  pull_request:
    paths:
      - '.github/workflows/swa-windows-native.yml'
      - 'package.json'
      - 'pnpm-*.yaml'
      - 'go.mod'
      - 'go.sum'
      - 'dependencies.lock.json'
      - 'third_party/orca-v1.4.230/package.json'
      - 'cmd/**'
      - 'internal/**'
      - 'contracts/**'
      - 'runtime/**'
      - 'scripts/**'
      - 'tests/swa-cli-headless/**'
      - 'third_party/orca-v1.4.230/src/**'
      - 'third_party/orca-v1.4.230/native/**'
      - 'third_party/orca-v1.4.230/config/**'
permissions:
  contents: read
concurrency:
  group: swa-windows-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-native-candidate:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.2
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare the pinned package manager
        shell: pwsh
        run: |
          npm install --prefix (Join-Path $env:RUNNER_TEMP 'swa-pnpm') --no-audit --no-fund pnpm@11.27.0
          if ($LASTEXITCODE -ne 0) { throw 'Pinned pnpm installation failed' }
      - name: Build, archive, install and exercise the actual candidate
        shell: pwsh
        run: |
          $env:SWA_CI_PHASE = 'driver-invocation'
          try {
            $python = (& python -c 'import sys; print(sys.executable)').Trim()
            if ($LASTEXITCODE -ne 0) { throw 'Actual Python is unavailable' }
            & ./scripts/verify-swa-windows-native.ps1 -PnpmCli (Join-Path $env:RUNNER_TEMP 'swa-pnpm/node_modules/pnpm/bin/pnpm.cjs') -Python $python
          } catch {
            $message = ('phase=' + $env:SWA_CI_PHASE + '; ' + $_.Exception.Message)
            if ($message.Length -gt 2000) { $message = $message.Substring(0, 2000) + ' [truncated; retain original logs]' }
            $escaped = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host ('::error title=SWA Windows native candidate::' + $escaped)
            throw
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swa-windows-native-evidence-${{ github.sha }}
          path: |
            .verification/swa-ci/windows/SOURCE
            .verification/swa-ci/windows/result.json
            .verification/swa-ci/windows/logs/*.log
            .verification/swa-ci/windows/logs/*.exit.txt
            .verification/swa-ci/windows/smoke/result.json
            .verification/swa-ci/windows/smoke/readiness-eof/result.json
            .verification/swa-ci/windows/smoke/readiness-eof/stdout.json
            .verification/swa-ci/windows/smoke/readiness-eof/stderr.log
            .verification/swa-ci/windows/smoke/readiness-eof/cim-exit-observations.json
            .verification/swa-ci/windows/smoke/readiness-eof/ready-service-observation.json
            .verification/swa-ci/windows/smoke/readiness-eof/latest-actual-observation.json
            .verification/swa-ci/windows/smoke/readiness-eof/actual-observation.json
            .verification/swa-ci/windows/smoke/readiness-eof/unsettled.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: swa-windows-cli-${{ github.sha }}
          path: |
            ${{ runner.temp }}/swa-artifacts/*.zip
            ${{ runner.temp }}/swa-artifacts/*.sha256
          if-no-files-found: error
          retention-days: 7
