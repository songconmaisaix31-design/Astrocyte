          type: integer
          const: 1
        stage:
          type: string
          enum:
            - S0
            - S1
        capabilities:
          type: object
          additionalProperties: false
          properties:
            imports:
              type: boolean
              description: True when the S1 material import service is assembled.
            approvals:
              type: boolean
              const: false
            execution:
              type: boolean
              const: false
            native_resume:
              type: boolean
              const: false
            handoff:
              type: boolean
              const: false
          required:
            - imports
            - approvals
            - execution
            - native_resume
            - handoff
          description: Availability of assembled HTTP operations, not evidence about installed
            local agent native abilities or completion of S1 acceptance.
        storage:
          type: object
          additionalProperties: false
          properties:
            engine:
              type: string
              enum:
                - sqlite
            schema_version:
              type: integer
              minimum: 1
          required:
            - engine
            - schema_version
        fixture:
          type: boolean
          const: false
      required:
        - schema_version
        - stage
        - capabilities
        - storage
        - fixture
      examples:
        - schema_version: 1
          stage: S0
          capabilities:
            imports: false
            approvals: false
            execution: false
            native_resume: false
            handoff: false
          storage:
            engine: sqlite
            schema_version: 1
          fixture: false
        - schema_version: 1
          stage: S1
          capabilities:
            imports: true
            approvals: false
            execution: false
            native_resume: false
            handoff: false
          storage:
            engine: sqlite
            schema_version: 5
          fixture: false
    AgentObservationV1:
      type: object
      additionalProperties: false
      description: Independent readiness observation; no credential inspection is implied.
      properties:
        status:
          type: string
          enum: [available, unavailable, unknown, unsupported]
