openapi: 3.1.0
info:
  title: Astrocyte HTTP v1
  version: 1.0.0
  description: SPEC v0.1 local foundation and S1 Attention contracts. Supported
    operations are explicitly marked; unassembled capabilities fail with 501.
    S1 protected reads use the local human session and writes require CSRF;
    request bodies never supply trusted actor identity. Fixture examples and
    CLI installation observations are not native execution or S1 acceptance evidence.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: /api/v1
    description: Loopback-only local backend
security: []
tags:
  - name: health
    description: health HTTP v1 contract
  - name: foundation
    description: foundation HTTP v1 contract
  - name: materials
    description: materials HTTP v1 contract
  - name: opportunities
    description: opportunities HTTP v1 contract
  - name: projects
    description: projects HTTP v1 contract
  - name: proposals
    description: proposals HTTP v1 contract
  - name: sessions
    description: sessions HTTP v1 contract
  - name: missions
    description: missions HTTP v1 contract
  - name: approvals
    description: approvals HTTP v1 contract
  - name: work-items
    description: work-items HTTP v1 contract
  - name: artifacts
    description: artifacts HTTP v1 contract
  - name: events
    description: events HTTP v1 contract
  - name: local-agents
    description: Cached local CLI readiness and native capability observations
paths:
  /source-collections/discover:
    post:
      operationId: discoverSourceCollections
      summary: Discover explicitly selected source collections
      description: Human CSRF command invokes a bounded public provider or an
        explicitly configured selected browser folder bridge and caches metadata.
        Failure preserves prior catalog; GET only reads cache. No binding, full
        body extraction, model call, credentials or automatic selection.
      tags:
        - materials
      x-s1-supported: true
      security:
        - HumanSession: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscoverSourceCollectionsRequestV1"
      responses:
        "200":
          description: Current service result; unknown and failure states remain explicit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceCollectionListV1"
        "400":
          description: Actionable structured error; no automatic replay of unknown effects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorV1"
        "403":
