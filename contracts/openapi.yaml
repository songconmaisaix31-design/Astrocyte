      operationId: requestDistillation
      summary: Queue automatic distillation from explicitly selected fixed source
        snapshots
      tags:
        - materials
      x-s1-supported: true
      description: Human-triggered durable processing. Only configured authorized
        source keys and real adapter provenance may be sent to the local Codex
        processor. Native read isolation is mandatory; unavailable processing
        remains explicit unsupported/failed. No source database or object paths
        are passed to the processor.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "202":
          description: Attention result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportJobV1"
        "400": &a16
          description: Structured service error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorV1"
        "403": *a16
        "404": *a16
        "409": *a16
        "500": *a16
        "501":
          description: Native processor or read isolation unsupported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorV1"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestDistillationRequestV1"
      security:
        - HumanSession: []
