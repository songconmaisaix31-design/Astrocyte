    post:
      operationId: createOpportunity
      summary: createOpportunity
      tags:
        - opportunities
      x-s1-supported: true
      description: S1 Attention service. Human writes require local session cookie and
        CSRF token. Agent credentials identify the caller but deny all protected
        data access until explicit user material scopes are configured. Reads
        never increase human attention.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "201":
          description: Attention result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpportunityDetailV1"
        "400": &a11
          description: Structured service error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorV1"
        "403": *a11
        "404": *a11
        "409": *a11
        "500": *a11
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpportunityRequestV1"
      security:
        - HumanSession: []
