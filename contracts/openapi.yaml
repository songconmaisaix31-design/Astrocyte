        "400": &a18
          description: Structured service error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorV1"
        "403": *a18
        "404": *a18
        "409": *a18
        "500": *a18
        "501":
          description: Profile adapter not connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorV1"
