components:
  schemas:
    ErrorV1:
      type: object
      additionalProperties: false
      properties:
        schema_version:
          type: integer
          const: 1
        error:
          type: object
          additionalProperties: false
          properties:
            code:
              type: string
              enum:
                - validation_failed
                - unsupported_capability
                - version_conflict
                - context_stale
                - index_stale
                - scope_denied
                - approval_required
                - approval_revoked
                - lease_lost
                - budget_exhausted
                - provider_unavailable
                - evidence_missing
                - delivery_unknown
                - not_found
                - internal_error
            message:
              type: string
            request_id:
              type: string
            retryable:
              type: boolean
            required_action:
              type: string
          required:
            - code
            - message
            - request_id
            - retryable
            - required_action
      required:
        - schema_version
        - error
      examples:
        - schema_version: 1
          error:
            code: unsupported_capability
            message: Not implemented in S0
            request_id: example-request
            retryable: false
            required_action: Read the current S0 capabilities; choose an implemented operation
    HealthV1:
      type: object
      additionalProperties: false
      properties:
        schema_version:
          type: integer
          const: 1
        status:
          type: string
          enum:
            - ok
        service:
          type: string
          enum:
            - astrocyte
      required:
        - schema_version
        - status
        - service
      examples:
        - schema_version: 1
          status: ok
          service: astrocyte
    FoundationV1:
      type: object
      additionalProperties: false
      properties:
        schema_version:
          type: integer
          const: 1
        stage:
          type: string
          enum:
            - S0
            - S1
        capabilities:
          type: object
          additionalProperties: false
          properties:
            imports:
              type: boolean
              description: True when the S1 material import service is assembled.
            approvals:
              type: boolean
              const: false
            execution:
              type: boolean
              const: false
            native_resume:
              type: boolean
              const: false
            handoff:
              type: boolean
              const: false
          required:
            - imports
            - approvals
            - execution
            - native_resume
            - handoff
          description: Availability of assembled HTTP operations, not evidence about installed
            local agent native abilities or completion of S1 acceptance.
        storage:
          type: object
          additionalProperties: false
          properties:
            engine:
              type: string
              enum:
                - sqlite
            schema_version:
              type: integer
              minimum: 1
          required:
            - engine
            - schema_version
        fixture:
          type: boolean
          const: false
      required:
        - schema_version
        - stage
        - capabilities
        - storage
        - fixture
      examples:
        - schema_version: 1
          stage: S0
          capabilities:
            imports: false
            approvals: false
            execution: false
            native_resume: false
            handoff: false
          storage:
            engine: sqlite
            schema_version: 1
          fixture: false
        - schema_version: 1
          stage: S1
          capabilities:
            imports: true
            approvals: false
            execution: false
            native_resume: false
            handoff: false
          storage:
            engine: sqlite
            schema_version: 5
          fixture: false
    AgentObservationV1:
      type: object
      additionalProperties: false
      description: Independent readiness observation; no credential inspection is implied.
      properties:
        status:
          type: string
          enum: [available, unavailable, unknown, unsupported]
        reason:
          type: string
          minLength: 1
        checked_at:
          type: [string, "null"]
          format: date-time
      required: [status, reason, checked_at]
      examples:
        - status: unknown
          reason: configuration_not_inspected
          checked_at: null
    NativeCapabilityObservationV1:
      type: object
      additionalProperties: false
      description: SPEC 8.1 native capability; CLI help or installation is insufficient evidence of support.
      properties:
        status:
          type: string
          enum: [supported, unsupported, unknown]
        reason:
          type: string
          minLength: 1
        checked_at:
          type: [string, "null"]
          format: date-time
      required: [status, reason, checked_at]
      examples:
        - status: unknown
          reason: native_runtime_not_tested
          checked_at: null
    LocalAgentV1:
      type: object
      additionalProperties: false
      description: CLI installation identity, independent of any private native session, project or Mission.
      properties:
        id:
          type: string
          minLength: 1
          description: Stable CLI adapter identity, not executable path or session ID.
        display_name:
          type: string
          minLength: 1
        version:
          type: [string, "null"]
          description: Observed version only; null if not observed.
        installed:
          $ref: "#/components/schemas/AgentObservationV1"
        configured:
          $ref: "#/components/schemas/AgentObservationV1"
        startable:
          $ref: "#/components/schemas/AgentObservationV1"
        capabilities:
          type: object
          additionalProperties: false
          properties:
            discover:
              $ref: "#/components/schemas/NativeCapabilityObservationV1"
            read_context:
              $ref: "#/components/schemas/NativeCapabilityObservationV1"
            start:
              $ref: "#/components/schemas/NativeCapabilityObservationV1"
            resume:
              $ref: "#/components/schemas/NativeCapabilityObservationV1"
            send:
              $ref: "#/components/schemas/NativeCapabilityObservationV1"
            stop:
              $ref: "#/components/schemas/NativeCapabilityObservationV1"
            observe:
              $ref: "#/components/schemas/NativeCapabilityObservationV1"
            reconcile:
              $ref: "#/components/schemas/NativeCapabilityObservationV1"
          required: [discover, read_context, start, resume, send, stop, observe, reconcile]
      required: [id, display_name, version, installed, configured, startable, capabilities]
      examples:
        - id: example-cli
          display_name: Example CLI (schema example only)
          version: null
          installed: {status: unknown, reason: cli_not_probed, checked_at: null}
          configured: {status: unknown, reason: configuration_not_inspected, checked_at: null}
          startable: {status: unknown, reason: native_runtime_not_tested, checked_at: null}
          capabilities:
            discover: {status: unknown, reason: native_runtime_not_tested, checked_at: null}
            read_context: {status: unknown, reason: native_runtime_not_tested, checked_at: null}
            start: {status: unknown, reason: native_runtime_not_tested, checked_at: null}
            resume: {status: unknown, reason: native_runtime_not_tested, checked_at: null}
            send: {status: unknown, reason: native_runtime_not_tested, checked_at: null}
            stop: {status: unknown, reason: native_runtime_not_tested, checked_at: null}
            observe: {status: unknown, reason: native_runtime_not_tested, checked_at: null}
            reconcile: {status: unknown, reason: native_runtime_not_tested, checked_at: null}
    LocalAgentListV1:
      type: object
      additionalProperties: false
      properties:
        schema_version:
          type: integer
          const: 1
        items:
          type: array
          items:
            $ref: "#/components/schemas/LocalAgentV1"
        next_cursor:
          type: [string, "null"]
      required: [schema_version, items, next_cursor]
      examples:
        - schema_version: 1
          items: []
          next_cursor: null
    SourceRefV1:
      type: object
      additionalProperties: false
      properties:
        material_id:
          type: string
        revision:
          type: integer
          minimum: 1
        locator:
          type: string
        span:
          type:
            - string
