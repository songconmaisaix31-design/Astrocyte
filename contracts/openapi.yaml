      description: >-
        Human-session read of bounded PATH-based CLI observations. This GET never
        executes CLI probes, reads credentials or scans private sessions/projects.
        Installation, configuration and startability are independent observations;
        native capabilities require actual native runtime checks. Unknown is not
        support. No project access or native control is granted by this inventory.
        A server without the inventory service returns 501, not an empty success.
      tags: [local-agents]
      x-s1-supported: true
      security:
        - HumanSession: []
      responses:
        "200":
          description: Cached inventory; an empty array means no observed entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalAgentListV1"
        "403":
          description: Human session required; Agent bearer grants no access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorV1"
        "500":
          description: Inventory query failed; do not substitute an empty array
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorV1"
        "501":
          description: Local Agent inventory is not assembled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorV1"
              example:
                schema_version: 1
                error:
                  code: unsupported_capability
                  message: local Agent inventory is not assembled
                  request_id: example-request
                  retryable: false
                  required_action: start_a_server_with_local_agent_inventory
