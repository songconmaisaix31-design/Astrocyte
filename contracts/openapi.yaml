        configured:
          $ref: "#/components/schemas/AgentObservationV1"
        startable:
          $ref: "#/components/schemas/AgentObservationV1"
        capabilities:
          type: object
          additionalProperties: false
          properties:
            discover:
              $ref: "#/components/schemas/NativeCapabilityObservationV1"
            read_context:
              $ref: "#/components/schemas/NativeCapabilityObservationV1"
            start:
              $ref: "#/components/schemas/NativeCapabilityObservationV1"
            resume:
              $ref: "#/components/schemas/NativeCapabilityObservationV1"
            send:
              $ref: "#/components/schemas/NativeCapabilityObservationV1"
            stop:
