        current_interest:
          $ref: "#/components/schemas/DimensionScoreV1"
        project_improvement:
          $ref: "#/components/schemas/DimensionScoreV1"
        originality:
          $ref: "#/components/schemas/DimensionScoreV1"
      required:
        - goal_progress
        - current_interest
        - project_improvement
        - originality
      examples:
        - goal_progress:
            value: null
            reason: unknown
          current_interest:
            value: null
            reason: unknown
          project_improvement:
            value: null
            reason: unknown
          originality:
            value: null
            reason: unknown
    MaterialV1:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        source_locator:
          type: string
        kind:
          type: string
          enum:
            - paper
            - video
            - text
            - file
        current_revision:
          type: integer
          minimum: 1
        lifecycle:
          type: string
          enum:
            - active
            - archived
            - withdrawn
        title:
          type: string
        collection_reason:
          type:
            - string
            - "null"
        source_spans:
          type: array
          items:
            type: string
        import_status:
          type: string
          enum:
            - queued
            - running
            - succeeded
            - failed
            - cancelled
        human_usage_count:
          type: integer
          minimum: 0
        agent_usage_count:
          type: integer
          minimum: 0
        attention_score:
          type: number
        long_term_value:
          type: number
        created_at:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
        pinned:
          type: boolean
        domain_ids:
          type: array
          items:
            type: string
        ranking_strategy:
          type: string
        ranking_reason:
          type: string
        attention_half_life_seconds:
          type: number
          exclusiveMinimum: 0
        attention_weights:
          type: object
          additionalProperties:
            type: number
            minimum: 0
