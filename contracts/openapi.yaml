openapi: 3.1.0
info:
  title: Astrocyte HTTP v1
  version: 1.0.0
  description: SPEC v0.1 local foundation and S1 Attention contracts. Supported
    operations are explicitly marked; unassembled capabilities fail with 501.
    S1 protected reads use the local human session and writes require CSRF;
    request bodies never supply trusted actor identity. Fixture examples and
    CLI installation observations are not native execution or S1 acceptance evidence.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: /api/v1
    description: Loopback-only local backend
security: []
tags:
  - name: health
    description: health HTTP v1 contract
  - name: foundation
    description: foundation HTTP v1 contract
  - name: materials
    description: materials HTTP v1 contract
  - name: opportunities
    description: opportunities HTTP v1 contract
  - name: projects
    description: projects HTTP v1 contract
  - name: proposals
    description: proposals HTTP v1 contract
  - name: sessions
    description: sessions HTTP v1 contract
  - name: missions
    description: missions HTTP v1 contract
  - name: approvals
    description: approvals HTTP v1 contract
  - name: work-items
    description: work-items HTTP v1 contract
  - name: artifacts
    description: artifacts HTTP v1 contract
  - name: events
    description: events HTTP v1 contract
  - name: local-agents
    description: Cached local CLI readiness and native capability observations
paths:
  /local-agents:
    get:
      operationId: listLocalAgents
      summary: Read cached local CLI inventory
      description: >-
        Human-session read of bounded PATH-based CLI observations. This GET never
        executes CLI probes, reads credentials or scans private sessions/projects.
        Installation, configuration and startability are independent observations;
        native capabilities require actual native runtime checks. Unknown is not
        support. No project access or native control is granted by this inventory.
        A server without the inventory service returns 501, not an empty success.
      tags: [local-agents]
      x-s1-supported: true
      security:
        - HumanSession: []
      responses:
        "200":
          description: Cached inventory; an empty array means no observed entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalAgentListV1"
        "403":
          description: Human session required; Agent bearer grants no access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorV1"
        "500":
          description: Inventory query failed; do not substitute an empty array
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorV1"
        "501":
          description: Local Agent inventory is not assembled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorV1"
              example:
                schema_version: 1
                error:
                  code: unsupported_capability
                  message: local Agent inventory is not assembled
                  request_id: example-request
                  retryable: false
                  required_action: start_a_server_with_local_agent_inventory
  /health:
    get:
      operationId: getHealth
