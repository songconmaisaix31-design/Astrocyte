        - HumanSession: []
  /distillations/processor:
    get:
      operationId: getDistillerStatus
      summary: Read actual processor availability and frozen configuration
      tags:
        - materials
      x-s1-supported: true
      description: Runtime facts only. Unconfigured or failed native isolation remains
        unavailable with required_action; no synthetic automatic capability.
      parameters: []
      responses:
        "200":
          description: Attention result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DistillerStatusV1"
        "400": &a17
          description: Structured service error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorV1"
        "403": *a17
        "404": *a17
        "409": *a17
        "500": *a17
      security:
        - HumanSession: []
        - AgentBearer: []
components:
  schemas:
    ErrorV1:
      type: object
      additionalProperties: false
      properties:
        schema_version:
          type: integer
          const: 1
        error:
          type: object
          additionalProperties: false
          properties:
            code:
              type: string
              enum:
                - validation_failed
                - unsupported_capability
                - version_conflict
                - context_stale
                - index_stale
                - scope_denied
                - approval_required
                - approval_revoked
                - lease_lost
                - budget_exhausted
                - provider_unavailable
                - evidence_missing
                - delivery_unknown
                - not_found
                - internal_error
            message:
              type: string
            request_id:
              type: string
            retryable:
              type: boolean
            required_action:
              type: string
          required:
            - code
            - message
            - request_id
            - retryable
            - required_action
      required:
        - schema_version
        - error
      examples:
        - schema_version: 1
          error:
            code: unsupported_capability
            message: Not implemented in S0
            request_id: example-request
            retryable: false
            required_action: Read the current S0 capabilities; choose an implemented operation
    HealthV1:
      type: object
      additionalProperties: false
      properties:
        schema_version:
          type: integer
          const: 1
        status:
