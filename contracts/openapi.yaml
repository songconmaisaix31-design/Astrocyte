          type: string
          minLength: 1
        checked_at:
          type: [string, "null"]
          format: date-time
      required: [status, reason, checked_at]
      examples:
        - status: unknown
          reason: configuration_not_inspected
          checked_at: null
    NativeCapabilityObservationV1:
      type: object
      additionalProperties: false
      description: SPEC 8.1 native capability; CLI help or installation is insufficient evidence of support.
      properties:
        status:
          type: string
          enum: [supported, unsupported, unknown]
        reason:
          type: string
          minLength: 1
        checked_at:
          type: [string, "null"]
          format: date-time
      required: [status, reason, checked_at]
      examples:
        - status: unknown
          reason: native_runtime_not_tested
          checked_at: null
    LocalAgentV1:
      type: object
      additionalProperties: false
      description: CLI installation identity, independent of any private native
        session, project or Mission.
      properties:
        id:
          type: string
          minLength: 1
          description: Stable CLI adapter identity, not executable path or session ID.
        display_name:
          type: string
          minLength: 1
